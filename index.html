<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Generative Ethic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAV -->
<nav>
  <span class="logo">The Generative Ethic</span>
  <div class="view-toggle">
    <button class="toggle-btn active" id="btn-wiki" onclick="switchView('wiki')">Read</button>
    <button class="toggle-btn" id="btn-map" onclick="switchView('map')">Map</button>
  </div>
</nav>

<!-- WIKI VIEW -->
<div id="wiki-view" class="view active">
  <aside class="wiki-sidebar" id="wiki-sidebar">
    <!-- populated by app.js -->
  </aside>

  <main class="wiki-main" id="wiki-main">
    <div class="loading">Loading…</div>
  </main>

  <aside class="right-panel">
    <span class="panel-label">Connected Documents</span>
    <div id="connections-list"></div>
  </aside>
</div>

<!-- MAP VIEW -->
<div id="map-view" class="view">
  <svg id="map-svg"></svg>
  <div class="map-hint">Drag to pan · Scroll to zoom · Click to read</div>
</div>

<!-- POPOVER -->
<div class="popover" id="popover">
  <button class="popover-close" onclick="closePopover()">✕</button>
  <div class="popover-term" id="popover-term"></div>
  <div class="popover-def" id="popover-def"></div>
  <div class="popover-source" id="popover-source"></div>
</div>

<!-- MAP TOOLTIP -->
<div class="map-tooltip" id="map-tooltip">
  <div class="map-tooltip-title" id="tt-title"></div>
  <div class="map-tooltip-sub" id="tt-sub"></div>
</div>

<script src="app.js"></script>
</body>
</html>
